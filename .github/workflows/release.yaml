name: Bump Version and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag version (e.g., 1.0.0 or v1.0.0)'
        required: true
      message:
        description: 'Tag message'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Git
        run: |
          git config user.name 'GitHub Actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Determine tag version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run the release workflow from the default branch: $DEFAULT_BRANCH."
            exit 1
          fi
          if [[ ! "$REQUESTED_VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must use semantic version format, for example 5.0.0 or v5.0.0."
            exit 1
          fi
          git fetch origin "$DEFAULT_BRANCH"
          git switch "$DEFAULT_BRANCH"
          git merge --ff-only "origin/$DEFAULT_BRANCH"

          VERSION_NUMBER="${REQUESTED_VERSION#v}"
          RELEASE_FLOOR="$(
            {
              jq -r '.version' package.json
              jq -r '.versions[].version' appcast.json
            } | sort -V | tail -n 1
          )"
          if ! printf '%s\n%s\n' "$RELEASE_FLOOR" "$VERSION_NUMBER" | sort -V -C; then
            echo "Version $VERSION_NUMBER is older than the current release floor $RELEASE_FLOOR."
            exit 1
          fi
          echo "VERSION=v$VERSION_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> "$GITHUB_ENV"

      - name: Select release source
        id: release_source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ env.VERSION }}
          VERSION_NUMBER: ${{ env.VERSION_NUMBER }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            git fetch origin "$DEFAULT_BRANCH"
            TAG_COMMIT="$(git rev-list -n 1 "$VERSION")"
            if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/$DEFAULT_BRANCH"; then
              echo "Existing tag $VERSION does not belong to the current release history."
              exit 1
            fi
            git switch --detach "$VERSION"
            if [[ "$(jq -r '.version' package.json)" != "$VERSION_NUMBER" ]] ||
              [[ "$(jq -r '.version' public/info.json)" != "$VERSION_NUMBER" ]]; then
              echo "Existing tag $VERSION does not contain matching project metadata."
              exit 1
            fi
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun ci

      - name: Update versions and package plugin
        env:
          VERSION_NUMBER: ${{ env.VERSION_NUMBER }}
        run: bun run release "$VERSION_NUMBER"

      - name: Validate release state
        run: |
          bun run lint
          bun run test

      - name: Commit and tag release
        if: steps.release_source.outputs.existing == 'false'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MESSAGE: ${{ github.event.inputs.message }}
          VERSION: ${{ env.VERSION }}
        run: |
          git add package.json public/info.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${VERSION}"
          fi
          git tag -a "$VERSION" -m "$MESSAGE"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$VERSION" --atomic

      - name: Inspect existing release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          if ! RELEASES="$(gh release list --limit 1000 --json isDraft,tagName)"; then
            exit 1
          fi
          STATE="$(
            jq -r --arg version "$VERSION" '
              map(select(.tagName == $version))
              | if length == 0 then "missing"
                elif any(.[]; .isDraft == false) then "published"
                else "draft"
                end
            ' <<< "$RELEASES"
          )"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          if [[ "$STATE" == "draft" ]]; then
            echo "overwrite=true" >> "$GITHUB_OUTPUT"
          else
            echo "overwrite=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.release_state.outputs.state != 'published'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body: ${{ github.event.inputs.message }}
          draft: true
          fail_on_unmatched_files: true
          files: dist/openai-translator-${{ env.VERSION_NUMBER }}.bobplugin
          name: ${{ env.VERSION }}
          overwrite_files: ${{ steps.release_state.outputs.overwrite }}
          tag_name: ${{ env.VERSION }}

      - name: Verify and publish release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE: ${{ steps.release_state.outputs.state }}
          VERSION: ${{ env.VERSION }}
          VERSION_NUMBER: ${{ env.VERSION_NUMBER }}
        run: |
          PACKAGE_PATH="dist/openai-translator-$VERSION_NUMBER.bobplugin"
          gh release download "$VERSION" --clobber --dir dist --pattern "openai-translator-$VERSION_NUMBER.bobplugin"
          unzip -t "$PACKAGE_PATH"

          if [[ "$RELEASE_STATE" != "published" ]]; then
            git fetch origin "$DEFAULT_BRANCH"
            RELEASE_FLOOR="$(
              {
                git show "origin/$DEFAULT_BRANCH:package.json" | jq -r '.version'
                git show "origin/$DEFAULT_BRANCH:appcast.json" | jq -r '.versions[].version'
              } | sort -V | tail -n 1
            )"
            if ! printf '%s\n%s\n' "$RELEASE_FLOOR" "$VERSION_NUMBER" | sort -V -C; then
              echo "Version $VERSION_NUMBER is older than the current release floor $RELEASE_FLOOR."
              exit 1
            fi
            gh release edit "$VERSION" --draft=false --latest
          fi

      - name: Update Appcast
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MESSAGE: ${{ github.event.inputs.message }}
          VERSION_NUMBER: ${{ env.VERSION_NUMBER }}
        run: |
          git switch "$DEFAULT_BRANCH"
          git fetch origin "$DEFAULT_BRANCH"
          git merge --ff-only "origin/$DEFAULT_BRANCH"

          bun scripts/package.mts appcast "$VERSION_NUMBER" "$MESSAGE"
          git add appcast.json
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: update appcast for ${VERSION}"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

name: 问题反馈 | Bug report
description: 报告可稳定复现的插件问题
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。纯翻译质量问题请统一提交到 [#30](https://github.com/nextai-translator/bob-plugin-openai-translator/issues/30)。

  - type: checkboxes
    attributes:
      label: 提交前确认 | Before submitting
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题
          required: true
        - label: 我已阅读[中文配置手册](https://github.com/nextai-translator/bob-plugin-openai-translator/blob/main/docs/configuration_manual_CN.md#最快开始)或 [English configuration manual](https://github.com/nextai-translator/bob-plugin-openai-translator/blob/main/docs/configuration_manual_EN.md#quick-start)
          required: true

  - type: input
    attributes:
      label: 插件版本 | Plugin version
      placeholder: 5.0.0
    validations:
      required: true

  - type: input
    attributes:
      label: Bob 版本 | Bob version
      placeholder: Bob 1.18.0
    validations:
      required: true

  - type: input
    attributes:
      label: macOS 版本 | macOS version
      placeholder: macOS 15.5
    validations:
      required: true

  - type: input
    attributes:
      label: 模型和 API 服务 | Model and API service
      description: 请填写模型 ID，并说明使用官方 API 还是第三方 API 服务；私有地址可以隐藏域名
    validations:
      required: true

  - type: textarea
    attributes:
      label: 配置 | Configuration
      description: 请列出与问题相关的设置或提供截图。不要提交 API Key、Authorization 请求头、私有域名或其他敏感信息
    validations:
      required: true

  - type: textarea
    attributes:
      label: 复现步骤 | Steps to reproduce
      description: 请提供能够稳定触发问题的最短步骤
    validations:
      required: true

  - type: textarea
    attributes:
      label: 实际结果和错误信息 | Actual result and error
      description: 请粘贴完整错误。需要 Bob 日志时，在 Console 中筛选 `[yetone.openai.translator]`，并先删除 API Key、原文和其他敏感信息
    validations:
      required: true

  - type: textarea
    attributes:
      label: 预期结果 | Expected result
    validations:
      required: true

  - type: textarea
    attributes:
      label: 补充信息 | Additional context
